<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VoSuSMa{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="{{ url_for('main.index') }}">VoSuSMa</a>
            <nav class="main-nav">
                <a href="{{ url_for('main.index') }}">Start</a>
                <a href="{{ url_for('klassen.liste') }}">Klassen</a>
                <a href="{{ url_for('schueler.liste') }}">SuS</a>
                <a href="{{ url_for('admin.index') }}">Admin</a>
                <a href="{{ url_for('backup.status') }}">Backup</a>
            </nav>
            <span class="env-badge env-badge--{{ config.ENV_NAME }}">{{ config.ENV_NAME }}</span>
        </div>
    </header>

    <main class="content {% block content_class %}{% endblock %}">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                    {% for category, message in messages %}
                        <li class="flash flash--{{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>

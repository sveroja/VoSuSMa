{% extends "base.html" %}
{% block title %}{{ titel }} – Admin – VoSuSMa{% endblock %}
{% block content %}
    <h1>{{ titel }}</h1>
    <form method="post" class="form">
        <div class="form__field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" required maxlength="150">
        </div>
        <div class="form__field">
            <label for="ansprechpartner">Ansprechpartner</label>
            <input type="text" id="ansprechpartner" name="ansprechpartner" value="{{ form.get('ansprechpartner', '') }}" maxlength="150">
        </div>
        <div class="form__field">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" maxlength="255">
        </div>
        <div class="form__field">
            <label for="telefon">Telefon</label>
            <input type="text" id="telefon" name="telefon" value="{{ form.get('telefon', '') }}" maxlength="50">
        </div>
        <div class="form__field">
            <label class="radio-label">
                <input type="checkbox" name="aktiv" {% if form.get('aktiv') %}checked{% endif %}>
                aktiv (bei den SuS auswählbar)
            </label>
        </div>
        <div class="form__actions">
            <button type="submit">Speichern</button>
            <a class="button button--secondary" href="{{ url_for('admin.betrieb_liste') }}">Abbrechen</a>
        </div>
    </form>
{% endblock %}
